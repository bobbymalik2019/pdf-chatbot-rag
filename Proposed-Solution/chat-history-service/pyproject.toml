[project]
name = "chat-history-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bobbymalik2019", email = "writetobobby@yahoo.com.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "psycopg>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
chat-history-service = "chat_history_service:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "requests>=2.34.2",
]
