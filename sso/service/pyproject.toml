[project]
name = "sso-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3", "argon2-cffi>=23.1,<26", "PyJWT[crypto]>=2.9,<3",
  "python-multipart>=0.0.12,<1"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/sso_service"]
[tool.pytest.ini_options]
pythonpath = ["src"]
